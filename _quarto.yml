format:
  html:
    theme:
      - cosmo
      - site/styles/icd.scss
    include-after-body:
      - site/version.html
      - site/colab-link.html
    toc: true
    toc-depth: 3
    lang: pt-BR

execute:
  freeze: auto
  warning: false
  message: false
