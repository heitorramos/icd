project:
  type: website
  output-dir: _site
  resources:
    - "vpl/**"
  render:
    - "*.qmd"
    - "aulas/*.qmd"
    - "slides/*.qmd"
    - "exemplos/**/*.qmd"
    - "exemplos/**/*.ipynb"

website:
  title: "Introdução à Ciência de Dados"
  site-url: "https://heitorramos.github.io/icd/"
  repo-url: "https://github.com/heitorramos/icd"
  repo-actions: [edit, issue]
  page-navigation: true
  navbar:
    background: "#17324d"
    foreground: "#ffffff"
    left:
      - text: "Início"
        href: index.qmd
      - text: "Programa"
        href: programa.qmd
      - text: "Aulas"
        href: aulas/index.qmd
  sidebar:
    - title: "Aulas"
      style: docked
      contents:
        - aulas/index.qmd
        - aulas/01-introducao.qmd
        - aulas/02-causalidade.qmd
        - aulas/06-tendencias-centrais.qmd
        - aulas/07-estimadores.qmd
        - aulas/08-risco-estimadores.qmd
        - aulas/09-tcl-intervalos.qmd
        - aulas/10-testes-hipoteses.qmd
        - aulas/11-bootstrap.qmd
        - aulas/12-testes-permutacao.qmd
        - aulas/13-permutacao-avancada.qmd
        - aulas/14-poder-multiplos.qmd

format:
  html:
    theme:
      - cosmo
      - site/styles/icd.scss
    toc: true
    toc-depth: 3
    lang: pt-BR

execute:
  freeze: auto
  warning: false
  message: false
