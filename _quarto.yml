project:
  type: website
  output-dir: _site
  resources:
    - "vpl/**"
  render:
    - "*.qmd"
    - "aulas/*.qmd"
    - "slides/*.qmd"
    - "exemplos/**/*.qmd"
    - "exemplos/**/*.ipynb"

website:
  title: "Introdução à Ciência de Dados"
  site-url: "https://heitorramos.github.io/icd/"
  repo-url: "https://github.com/heitorramos/icd"
  repo-actions: [edit, issue]
  page-navigation: true
  page-footer:
    center: "Material produzido por Heitor Ramos com o auxílio do ChatGPT. Conteúdo baseado no material do Prof. Flávio Vinícius, disponível em [icd-ufmg.github.io](https://icd-ufmg.github.io/)."
    right: '<span id="site-version" class="site-version" aria-live="polite">Versão do site: verificando…</span>'
    border: true
  navbar:
    background: "#17324d"
    foreground: "#ffffff"
    left:
      - text: "Início"
        href: index.qmd
      - text: "Cronograma"
        href: cronograma.qmd
      - text: "Projeto"
        href: projeto.qmd
      - text: "Aulas"
        href: aulas/index.qmd
  sidebar:
    - title: "Aulas"
      style: docked
      contents:
        - aulas/index.qmd
        - cronograma.qmd
        - projeto.qmd
        - section: "Módulo 0 · Motivação"
          contents:
            - aulas/01-introducao.qmd
            - aulas/02-causalidade.qmd
        - section: "Módulo 1 · Análise Exploratória"
          contents:
            - aulas/03-tabelas-tipos.qmd
            - aulas/04-eda.qmd
            - aulas/05-fundamentos-visualizacao.qmd
            - aulas/06-boas-praticas-visualizacao.qmd
            - aulas/07-tendencias-centrais.qmd
        - section: "Módulo 2 · Inferência Estatística"
          contents:
            - aulas/08-estimadores.qmd
            - aulas/09-risco-estimadores.qmd
            - aulas/10-tcl-intervalos.qmd
            - aulas/11-testes-hipoteses.qmd
            - aulas/12-bootstrap.qmd
            - aulas/13-testes-permutacao.qmd
            - aulas/14-permutacao-avancada.qmd
            - aulas/15-poder-multiplos.qmd
        - section: "Módulo 3 · Modelagem e Aprendizado de Máquina"
          contents: []

format:
  html:
    theme:
      - cosmo
      - site/styles/icd.scss
    include-after-body: site/version.html
    toc: true
    toc-depth: 3
    lang: pt-BR

execute:
  freeze: auto
  warning: false
  message: false
