project:
  type: website
  output-dir: _site
  pre-render:
    - python3 scripts/sync_cronograma.py
  resources:
    - "vpl/**"
  render:
    - "*.qmd"
    - "aulas/*.qmd"
    - "slides/*.qmd"
    - "exemplos/**/*.qmd"
    - "exemplos/**/*.ipynb"
    - "!exemplos/**/notebook-colab.ipynb"

website:
  title: "Introdução à Ciência de Dados"
  site-url: "https://heitorramos.github.io/icd/"
  repo-url: "https://github.com/heitorramos/icd"
  repo-actions: [edit, issue]
  page-navigation: true
  page-footer:
    center: "Material produzido por Heitor Ramos com o auxílio do ChatGPT. Conteúdo baseado no material do Prof. Flávio Vinícius, disponível em [icd-ufmg.github.io](https://icd-ufmg.github.io/)."
    right: '<span id="site-version" class="site-version" aria-live="polite">Versão do site: verificando…</span>'
    border: true
  navbar:
    background: "#17324d"
    foreground: "#ffffff"
    left:
      - text: "Início"
        href: index.qmd
      - text: "Cronograma"
        href: cronograma.qmd
      - text: "Projeto"
        href: projeto.qmd
      - text: "Aulas"
        href: aulas/index.qmd
  sidebar:
    - title: "Aulas"
      style: docked
      collapse-level: 1
      contents:
        - aulas/index.qmd
        - cronograma.qmd
        - projeto.qmd
        # BEGIN AUTO: aulas liberadas
        - section: "Módulo 0 · Motivação"
          contents:
            - aulas/01-introducao.qmd
            - text: "Material de apoio · Aula 01"
              href: exemplos/01-introducao-dados/notebook.ipynb
            - aulas/02-causalidade.qmd
            - text: "Material de apoio · Aula 02"
              href: exemplos/02-experimento-ab/notebook.ipynb
        - section: "Módulo 1 · Análise Exploratória"
          contents:
            - aulas/03-tabelas-tipos.qmd
            - text: "Material de apoio · Aula 03"
              href: exemplos/03-tabelas-tipos/notebook.qmd
            - aulas/04-eda.qmd
            - text: "Material de apoio · Aula 04"
              href: exemplos/04-eda-olist/notebook.qmd
            - aulas/05-fundamentos-visualizacao.qmd
            - text: "Material de apoio · Aula 05"
              href: exemplos/05-fundamentos-visualizacao/notebook.qmd
            - aulas/06-boas-praticas-visualizacao.qmd
            - text: "Material de apoio · Aula 06"
              href: exemplos/06-boas-praticas-visualizacao/notebook.qmd
            - aulas/07-tendencias-centrais.qmd
            - text: "Material de apoio · Aula 07"
              href: exemplos/07-tendencias-centrais/notebook.ipynb
        - section: "Módulo 2 · Inferência Estatística"
          contents:
            - aulas/08-estimadores.qmd
            - text: "Material de apoio · Aula 08"
              href: exemplos/08-estimadores/notebook.qmd
            - aulas/09-risco-estimadores.qmd
            - aulas/10-tcl-intervalos.qmd
            - text: "Material de apoio · Aula 10"
              href: exemplos/10-tcl-inferencia/notebook.qmd
            - aulas/11-testes-hipoteses.qmd
            - text: "Material de apoio · Aula 11"
